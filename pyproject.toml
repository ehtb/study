[project]
name = "transformer"
version = "0.1.0"
description = "Machine learning from first principles — GPT, recommendation engines, and beyond, built from scratch in Jupyter notebooks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Edo Balvers", email = "i@edo.me" }
]
keywords = ["machine-learning", "deep-learning", "transformers", "language-models", "recommendation-systems", "reinforcement-learning", "jupyter", "educational"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "accelerate>=1.14.0",
    "datasets>=5.0.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.8.0",
    "numpy>=2.4.6",
    "peft>=0.19.1",
    "scikit-learn>=1.4.0",
    "tiktoken>=0.13.0",
    "torch>=2.13.0",
    "transformers>=5.14.0",
    "trl>=1.8.0",
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
search-path = ["lab"]

[project.urls]
Repository = "https://github.com/ehtb/study"
Issues = "https://github.com/ehtb/study/issues"

